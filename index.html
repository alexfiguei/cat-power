(function(){var q=new URLSearchParams(location.search).get('u');
 try{localStorage.removeItem('cp_flavor')}catch(e){}
 window.FLAV=q==='mary'?'mary':'cat';window.APPNAME=FLAV==='mary'?'Mary Amor Power':'Cat Power';
 if(FLAV==='mary'){document.documentElement.classList.add('mary');
  document.querySelector('link[rel=manifest]').href='manifest-mary.webmanifest';

<style>:root{color-scheme:light;--sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));--sal:max(env(safe-area-inset-left,0px),var(--safe-area-inset-left,0px));--sar:max(env(safe-area-inset-right,0px),var(--safe-area-inset-right,0px));padding-top:var(--sat);padding-bottom:var(--sab)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cat Power</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna para telemóvel; barra de separadores fixa em baixo; cores dos dias = cores dos discos olímpicos (20 azul, 25 vermelho, 15 amarelo, 10 verde) */
:root{
  --bg:#F5F7F8; --surface:#FFFFFF; --ink:#15202A; --muted:#5B6975; --line:#D4DBE0; --soft:#E3E8EC;
  --blue:#1F5AD6; --red:#CF3A2C; --yellow:#E7B11C; --green:#2C8A4E; --ok:#2C8A4E; --warn:#B7791F;
  --onplate:#FFFFFF; --onyellow:#1B1B12; --accent:var(--yellow);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
/* Sempre claro, mesmo com o telemóvel em modo escuro */
:root,:root[data-theme="dark"]{color-scheme:light}
html.mary{--accent:#E8457A}
html.mary .brand svg{display:none}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,var(--sal));padding-right:max(16px,var(--sar));padding-block:14px 120px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:2.3rem;font-weight:800}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:.8rem;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* marca */
.brand{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.brand svg{width:42px;height:42px;flex:none}
.brand img,.avatar{width:46px;height:46px;border-radius:50%;flex:none;object-fit:cover}
.avatar.big{width:84px;height:84px}
.brand b{font-family:var(--display);font-size:1.6rem;text-transform:uppercase;font-weight:800;display:block;line-height:1;letter-spacing:.02em}
.brand small{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.stats b{font-family:var(--display);font-size:1.7rem;font-weight:800;display:block;line-height:1.1}
.stats small{color:var(--muted);font-size:.8rem;line-height:1.2;display:block}
.codes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.codebtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:68px}
.codebtn b{font-family:var(--display);font-size:1.5rem;line-height:1}
.codebtn small{font-size:.68rem;color:var(--ok);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.codebtn small.nx{color:var(--muted)}
.nextline{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.95rem}
.nextline span{color:var(--muted)}
.nextline b{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.15rem;text-transform:uppercase;text-align:right}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pics figure{margin:0;position:relative;border-radius:10px;overflow:hidden;background:var(--soft);aspect-ratio:3/2;max-width:100%}
.pics img{width:100%;height:100%;object-fit:cover;display:block}
.pics figcaption{position:absolute;left:6px;top:6px;background:rgba(21,32,42,.82);color:#fff;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:6px}
.vid{font-size:.9rem;font-weight:600;color:var(--blue)}
.codebtn.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dot{width:12px;height:12px;border-radius:50%}
/* topo */
.top{display:flex;align-items:center;gap:14px}
.plate{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;position:relative;color:var(--onplate);font-family:var(--display);font-weight:800;font-size:1.25rem;box-shadow:inset 0 0 0 4px rgba(0,0,0,.14)}
.plate::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 2px rgba(0,0,0,.18)}
.plate span{position:absolute;top:7px;font-size:.95rem}
.plate.yellow{color:var(--onyellow)}
.p-blue{background:var(--blue)}.p-red{background:var(--red)}.p-yellow{background:var(--yellow)}.p-green{background:var(--green)}.p-none{background:var(--soft);color:var(--muted)}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.day b{font-family:var(--display);font-size:.95rem;text-transform:uppercase}
.day i{width:10px;height:10px;border-radius:50%;display:block}
.day.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day.today b{text-decoration:underline;text-underline-offset:3px}

.banner{border-radius:12px;padding:10px 12px;background:var(--soft);font-size:.95rem}
.banner.deload{background:color-mix(in srgb,var(--warn) 18%,var(--surface));border:1px solid var(--warn)}

/* exercício */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-head>div{min-width:0}
.ex-meta{font-size:.92rem;color:var(--muted)}
.ex-idx{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--line);line-height:1}
.hist{font-size:.9rem;color:var(--muted)}
.up{color:var(--ok);font-weight:700}
.coach{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:.92rem;line-height:1.4}
.coach small{color:var(--muted);font-size:.85rem}
details{border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;font-size:.95rem;list-style:none;display:flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";font-family:var(--display);font-weight:800;width:18px;height:18px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:.9rem}
details[open] summary::before{content:"–"}
details ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.care{margin-top:8px;font-size:.9rem;padding:8px 10px;border-radius:8px;background:var(--soft)}
.care b{color:var(--warn)}

.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 48px;gap:8px;align-items:center}
.set-n{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center}
.fld{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;min-width:0}
.fld input{border:0;background:transparent;font:inherit;font-size:16px;font-weight:600;width:100%;min-width:0;padding:10px 0;color:var(--ink);font-variant-numeric:tabular-nums}
.fld input::placeholder{color:var(--muted);font-weight:500}
.fld span{font-size:.8rem;color:var(--muted)}
.chk{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:1.2rem;font-weight:700;color:var(--muted)}
.set.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.set.done .fld{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}

.btn{border:0;border-radius:12px;padding:14px 16px;font-family:var(--display);font-weight:700;font-size:1.15rem;text-transform:uppercase;letter-spacing:.04em;background:var(--ink);color:var(--bg);width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:9px 12px;font-size:1rem;width:auto}

/* metas */
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macro{border-radius:12px;background:var(--soft);padding:10px 8px;text-align:center}
.macro b{display:block;font-family:var(--display);font-size:1.6rem;font-weight:800;line-height:1.1}
.macro small{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.meal{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal time{font-family:var(--display);font-weight:700;font-size:1.1rem}
.meal ul{margin:4px 0 6px;padding-left:18px;font-size:.95rem}
.meal .mm{font-size:.82rem;color:var(--muted)}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.95rem}
.kv span:nth-child(even){font-weight:700;text-align:right}

.sched{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:44px 14px 1fr;gap:10px;align-items:center;font-size:.95rem}
.srow b{font-family:var(--display);text-transform:uppercase}
.srow i{width:14px;height:14px;border-radius:50%}

.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.form .full{grid-column:1/-1}
.form input,.form select{font:inherit;font-size:16px;color:var(--ink);padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
.row{display:flex;gap:8px;align-items:stretch}
.row .fld{flex:1}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.watch{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.watch div{background:var(--soft);border-radius:10px;padding:8px 4px;text-align:center}
.watch b{display:block;font-family:var(--display);font-size:1.35rem;font-weight:800;line-height:1.1}
.watch small{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.hist-row{display:grid;grid-template-columns:52px 26px 1fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.hist-row:first-child{border-top:0}
.hist-row b{font-family:var(--display);font-size:1.05rem}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.82rem;font-weight:600;background:var(--soft)}
.pill.ok{background:color-mix(in srgb,var(--ok) 20%,var(--surface));color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,var(--surface));color:var(--warn)}

/* barra de separadores */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:var(--sab);padding-left:max(8px,var(--sal));padding-right:max(8px,var(--sar))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;font-weight:600;color:var(--muted);min-width:0}

/* histórico */
.hsum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.hsum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.hsum b{font-family:var(--display);font-size:1.7rem;font-weight:800;display:block;line-height:1.1}
.hsum small{color:var(--muted);font-size:.8rem;display:block}
.hhead{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap}
.hhead .dot{flex:none;width:14px;height:14px}
.hhead h3{flex:1;min-width:0}
.hhead time{font-size:.85rem;color:var(--muted);flex-basis:100%;padding-left:24px}
.prs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.exrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem}
.exrow:first-child{border-top:0}
.exrow span:last-child{text-align:right;font-weight:600}
.est{font-size:.7rem;color:var(--muted)}
.del{background:none;border:0;color:var(--red);font-weight:600;font-size:.9rem;padding:8px 0 0}
nav.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--ink)}
nav.tabs button[aria-selected="true"] svg{stroke:var(--blue)}

/* temporizador */
#timer{position:fixed;z-index:30;left:max(12px,var(--sal));right:max(12px,var(--sar));bottom:calc(70px + var(--sab));
  max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#timer .tt{flex:1;min-width:0}
#t-time{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
#t-label{font-size:.8rem;opacity:.8}
#timer button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:10px;padding:8px 10px;font-weight:700}
#t-bar{position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--yellow);transform-origin:left;transition:transform .25s linear}
#timer.over{background:var(--ok)}
#toast{position:fixed;z-index:40;left:50%;top:calc(14px + var(--sat));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.95rem;max-width:90vw}
@media (prefers-reduced-motion:reduce){#t-bar{transition:none}}
</style>
</head>

<div class="wrap"><header class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 5l10 8h10l10-8v19c0 7.5-6.5 13-15 13S5 31.5 5 24z" fill="var(--ink)"/><path d="M12.5 22.5l5.5 2M27.5 22.5l-5.5 2" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round"/></svg><img id="brand-img" alt="" hidden><div><b id="appname">Cat Power</b><small>O teu treino. O teu ritmo.</small></div></header><div id="app"></div></div>

</div>
<div id="toast" hidden></div>

<script>
/* ---------- DADOS DO PLANO ---------- */
/* Cada exercício é um "posto" com 3 variantes do mesmo movimento (máquina, halteres, cabo...).
   A variante muda sempre que o treino se repete; a progressão é comparada com a última vez da mesma variante.
   iso = exercício de isolamento (ganha +1 série nas semanas 3 e 4). img = há fotos da variante. */
const SESS={
 A:{name:'Superior · Força',plate:20,cls:'blue',dur:'60–70 min',ex:[
  {sets:4,reps:[6,10],rest:150,inc:2,v:[
   {id:'sup_incl',img:1,n:'Supino inclinado com halteres',
    cues:['Banco a 30°. Junta as omoplatas e empurra-as para baixo antes de começar.','Desce até os halteres ficarem ao lado do peito, cotovelos a ~45° do tronco.','Desce em 2–3 s, sobe com força.'],
    care:'Se o ombro incomodar, usa pega neutra (palmas viradas uma para a outra).'},
   {id:'sup_incl_maq',img:1,n:'Supino inclinado na máquina (ou no Smith)',inc:2.5,
    cues:['Ajusta o banco para as pegas ficarem na parte de cima do peito.','Omoplatas juntas e coladas ao encosto.','Desce controlado até o peito esticar e empurra sem bloquear os cotovelos.']},
   {id:'sup_plano_h',img:1,n:'Supino plano com halteres',
    cues:['Pés firmes no chão, omoplatas juntas e para baixo.','Desce até os halteres ficarem ao lado do peito, cotovelos a ~45°.','Desce em 2–3 s, sobe com força.'],
    care:'Se o ombro incomodar, usa pega neutra.'}]},
  {sets:4,reps:[8,10],rest:120,inc:2.5,v:[
   {id:'remada_peito',img:1,n:'Remada com apoio no peito',
    cues:['Peito sempre encostado ao apoio (máquina ou banco inclinado).','Puxa os cotovelos para trás, junto ao corpo.','Aperta as omoplatas 1 s no fim e volta controlado.'],
    care:'O apoio no peito tira a carga da lombar. Preferível à remada curvada com barra.'},
   {id:'remada_cabo',img:1,n:'Remada sentada no cabo, pega estreita',
    cues:['Tronco direito, com ligeira inclinação à frente no início.','Puxa a pega até ao umbigo, cotovelos junto ao corpo.','Sem balançar o tronco para trás.'],
    care:'Lombar neutra o tempo todo.'},
   {id:'remada_maq',img:1,n:'Remada na máquina convergente (tipo Hammer)',
    cues:['Peito encostado ao apoio.','Puxa os cotovelos para trás e aperta as omoplatas 1 s.','Volta até esticar bem os braços.']}]},
  {sets:3,reps:[8,12],rest:90,inc:2.5,v:[
   {id:'puxada',img:1,n:'Puxada frontal, pega média',
    cues:['Peito alto, tronco ligeiramente inclinado para trás.','Leva os cotovelos para baixo e para trás até a barra chegar ao queixo.','Sobe devagar até esticar bem os braços.']},
   {id:'puxada_uni',img:1,n:'Puxada unilateral no cabo',
    cues:['Um braço de cada vez, pega à frente da cara.','Leva o cotovelo para baixo, até junto da anca.','Sobe devagar até sentires o dorsal esticar.']},
   {id:'puxada_maq',img:1,n:'Puxada na máquina convergente',
    cues:['Coxas presas debaixo dos rolos.','Puxa os cotovelos para baixo e para trás.','Controla a subida até esticar bem.']}]},

 const p=S.profile,t=targets(),G=goal(),age=p.age||30,mp=mealPlan(t),T=mp.T,per=Math.round(t.P/mp.meals.length/5)*5,agua=Math.round(p.w*0.035*2)/2;
 const extra=p.goal==='ganhar'?'<li><b>Sem fome?</b> Batido: 300 ml leite, 50 g aveia, 1 banana, 20 g manteiga de amendoim ≈ 650 kcal.</li>':
  (p.goal==='perder'||p.goal==='definir')?'<li><b>Fome?</b> Começa as refeições pelos legumes e pela proteína. Fruta inteira sacia mais do que sumo.</li><li><b>Sem pressa:</b> perder ½ kg por semana protege o músculo e dá energia para treinar.</li>':'';
 return `<div class="stack"><div><p class="eyebrow">${G.eb}</p><h1>${G.h1}</h1></div>
 <div class="card stack"><h3>Alvo diário</h3><div class="macros num">
  <div class="macro"><b>${t.kcal}</b><small>kcal</small></div>
  <div class="macro"><b>${t.P}</b><small>Proteína g</small></div>
  <div class="macro"><b>${t.C}</b><small>Hidratos g</small></div>
  <div class="macro"><b>${t.F}</b><small>Gordura g</small></div></div>
  <p class="muted" style="font-size:.92rem">Calculado para ${p.sex==='f'?'mulher':'homem'}, ${age} anos, ${p.h} cm, ${fmt(p.w)} kg · objetivo: ${G.n.toLowerCase()}. Proteína a ${fmt(G.P)} g/kg, gordura a ${fmt(G.F)} g/kg, o resto em hidratos.${S.adj?` Inclui ajuste de ${S.adj>0?'+':''}${S.adj} kcal.`:''}</p></div>
 <div class="card"><h3>Um dia tipo</h3><p class="muted num" style="font-size:.9rem;margin-top:2px">≈ ${T.k} kcal · ${T.p} g P · ${T.c} g H · ${T.f} g G</p>
  <div style="margin-top:6px">${mp.meals.map(m=>`<div class="meal"><time class="num">${m.t}</time><div><b>${m.n}</b><ul>${m.it.map(x=>`<li>${x}</li>`).join('')}</ul><p class="mm num">${m.k} kcal · ${m.p} g proteína</p></div></div>`).join('')}</div>
  <p class="banner" style="margin-top:8px">As quantidades são calculadas para o teu alvo. Quando mudas o peso ou o objetivo, o plano ajusta-se sozinho.</p></div>
 <div class="card stack"><h3>Trocas equivalentes</h3><div class="kv num">
  <span>110 g arroz cru</span><span>110 g massa crua · 450 g batata</span>
  <span>80 g aveia</span><span>120 g pão integral</span>
  <span>150 g frango cru</span><span>170 g pescada · 4 ovos + 2 claras</span>
  <span>150 g skyr</span><span>1 dose de whey (30 g)</span></div></div>
 <div class="card stack"><h3>Dicas que fazem diferença</h3><ul class="list">
  <li><b>≈ ${per} g de proteína por refeição.</b> Espalhar a proteína pelo dia ajuda o músculo${age>=40?', sobretudo depois dos 40':''}.</li>
  <li><b>Hidratos à volta do treino:</b> lanche 1–2 h antes, jantar com batata ou arroz depois.</li>
  <li><b>Água:</b> ${fmt(agua)} L por dia, mais 0,5 L por hora de treino.</li>
  ${extra}
  <li><b>Álcool</b> trava a recuperação e a síntese de proteína. Guarda para ocasiões.</li>
  <li><b>Pesa os alimentos</b> nas primeiras 2–3 semanas, até saberes as porções de olho.</li></ul></div>
 <div class="card stack"><h3>Suplementos (opcionais)</h3><ul class="list">
  <li><b>Creatina monohidratada:</b> 3–5 g por dia, todos os dias, a qualquer hora. É o suplemento mais estudado para força e massa muscular.</li>
  <li><b>Whey:</b> só se não chegares à proteína com comida.</li>

}

/* ---------- EU ---------- */
function trend(){const cut=Date.parse(TODAY)-28*864e5;const w=S.weights.filter(x=>Date.parse(x.d)>=cut);if(w.length<3)return null;
 const xs=w.map(x=>(Date.parse(x.d)-cut)/(7*864e5)),ys=w.map(x=>x.kg);if((xs[xs.length-1]-xs[0])*7<10)return null;
 const mx=xs.reduce((a,b)=>a+b)/xs.length,my=ys.reduce((a,b)=>a+b)/ys.length;let nu=0,de=0;xs.forEach((x,i)=>{nu+=(x-mx)*(ys[i]-my);de+=(x-mx)**2});return de?nu/de:null}
function chart(){const w=[...S.weights].sort((a,b)=>a.d<b.d?-1:1).slice(-30);
 if(w.length<2)return `<p class="muted" style="font-size:.92rem">O gráfico aparece a partir do 2.º registo. Pesa-te 2–3 vezes por semana, de manhã, em jejum, depois da casa de banho.</p>`;
 const W=340,H=160,pl=40,pr=12,pt=14,pb=26;const ks=w.map(x=>x.kg);let mn=Math.min(...ks),mx=Math.max(...ks);if(mx-mn<1){const m=(mx+mn)/2;mn=m-0.5;mx=m+0.5}
 const t0=Date.parse(w[0].d),t1=Date.parse(w[w.length-1].d),sp=Math.max(1,t1-t0);
 const X=d=>pl+(Date.parse(d)-t0)/sp*(W-pl-pr),Y=k=>pt+(mx-k)/(mx-mn)*(H-pt-pb);
 const pts=w.map(x=>`${X(x.d).toFixed(1)},${Y(x.kg).toFixed(1)}`);
 const area=`M${pts[0]} L${pts.join(' L')} L${X(w[w.length-1].d).toFixed(1)},${H-pb} L${pl},${H-pb} Z`;
 const ticks=[mx,(mx+mn)/2,mn];const last=w[w.length-1];
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do peso">
  ${ticks.map(k=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(k)}" y2="${Y(k)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(k)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Barlow,sans-serif">${fmt(Math.round(k*10)/10)}</text>`).join('')}
  <path d="${area}" fill="var(--blue)" fill-opacity=".12"/>
  <polyline points="${pts.join(' ')}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round"/>
  ${w.map(x=>`<circle cx="${X(x.d)}" cy="${Y(x.kg)}" r="2.5" fill="var(--blue)"/>`).join('')}
  <circle cx="${X(last.d)}" cy="${Y(last.kg)}" r="5" fill="var(--surface)" stroke="var(--blue)" stroke-width="2.5"/>
  <text x="${pl}" y="${H-8}" font-size="11" fill="var(--muted)" font-family="Barlow,sans-serif">${dshort(w[0].d)}</text>
  <text x="${W-pr}" y="${H-8}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Barlow,sans-serif">${dshort(last.d)}</text></svg></div>`}
function vWatchEu(){
 let h=`<div class="card stack"><h3>Relógio Samsung</h3>`;
 if(!NATIVE)h+=`<p class="muted" style="font-size:.92rem">A ligação ao Galaxy Watch e ao Samsung Health funciona na app Android da Cat Power.</p>`;
 else{
  h+=S.hc.on?`<p><span class="pill ok">Ligado</span> Atualiza para importar o registo do relógio para o Histórico, com duração, frequência cardíaca e calorias disponíveis.</p><button class="btn sm" data-act="watch">Atualizar relógio</button><button class="btn ghost sm" data-act="hc">Rever autorizações</button>`
   :`<p>Liga a app ao Samsung Health para juntar os dados do relógio a cada treino.</p><button class="btn sm" data-act="hc">Ligar ao Samsung Health</button>
     <p class="muted" style="font-size:.88rem">No Samsung Health ativa a partilha com o Health Connect: Samsung Health → ⋮ → Definições → Health Connect.</p>`;
 }
 const rows=[...S.history].sort((a,b)=>(b.t1||Date.parse(b.d))-(a.t1||Date.parse(a.d))).slice(0,10).map(x=>{const w=x.watch||(S.watch[x.d]&&!S.watch[x.d].id?S.watch[x.d]:null),s=SESS[x.code];
  return `<div class="hist-row num"><b>${dshort(x.d)}</b><span class="dot p-${s?s.cls:'none'}"></span><span>${x.source==='watch'?'Relógio':'Treino '+x.code}${w?` · ${w.dur} min${w.hrAvg?' · FC '+w.hrAvg:''}${w.kcal!=null?' · '+w.kcal+' kcal':''}`:''}</span></div>`}).join('');
 h+=rows?`<div><p class="eyebrow" style="margin-bottom:4px">Últimos treinos</p>${rows}</div>`:'';
 return h+'</div>'}
function profForm(p){return `<div class="form">
  <label>Sexo<select id="p-sex"><option value="f" ${p.sex==='f'?'selected':''}>Mulher</option><option value="m" ${p.sex!=='f'?'selected':''}>Homem</option></select></label>
  <label>Idade<input id="p-age" inputmode="numeric" autocomplete="off" placeholder="anos" value="${p.age||''}"></label>
  <label>Altura (cm)<input id="p-h" inputmode="numeric" autocomplete="off" value="${p.h}"></label>
  <label>Peso (kg)<input id="p-w" inputmode="decimal" autocomplete="off" value="${fmt(p.w)}"></label>
  <label class="full">Objetivo<select id="p-goal">${p.goal?'':'<option value="" selected disabled>Escolhe o teu objetivo</option>'}${Object.entries(GOALS).map(([k,g])=>`<option value="${k}" ${p.goal===k?'selected':''}>${g.n}</option>`).join('')}</select></label>
  <label class="full">Atividade fora do ginásio<select id="p-act">
   <option value="1.45" ${p.act==1.45?'selected':''}>Sentado a maior parte do dia</option>
   <option value="1.55" ${p.act==1.55?'selected':''}>Misto: algum tempo de pé e a andar</option>
   <option value="1.65" ${p.act==1.65?'selected':''}>Muito tempo de pé ou trabalho físico</option></select></label></div>`}
function vSetup(){const m=FLAV==='mary';
 return `<div class="stack"><div style="display:flex;align-items:center;gap:14px">${m?'<img class="avatar big" src="icons/mary-avatar.png" alt="Mary">':''}<div><p class="eyebrow">${m?'Olá, Mary':'Bem-vindo'}</p><h1>Vamos começar</h1></div></div>
 <div class="card stack"><p>Preenche os teus dados. A app calcula as calorias e a alimentação para o teu objetivo e ajusta-se quando o peso muda.</p>
  ${profForm(S.profile)}<button class="btn" data-act="setup">Começar</button></div>
 <p class="muted" style="font-size:.9rem">Podes mudar tudo mais tarde no separador «Eu».</p></div>`}
function vEu(){
 const p=S.profile,t=targets(),r=trend(),G=goal(),sg=x=>(x>0?'+':'')+fmt(x);
 let rec=`<p class="muted" style="font-size:.92rem">Com 3 ou mais registos em 10+ dias, a app diz-te se deves comer mais ou menos. Para «${G.n}» o ritmo certo é ${sg(G.lo)} a ${sg(G.hi)} kg por semana.</p>`;
 if(r!==null){const rs=sg(Math.round(r*100)/100)+' kg/semana';
  if(r<G.lo)rec=`<p><span class="pill warn">${rs}</span> ${G.lo<0?'A descer depressa demais: assim perdes músculo. Come mais 150 kcal por dia.':'Abaixo do alvo. Come mais 150 kcal por dia.'}</p><button class="btn sm" data-act="adj" data-v="150">Aplicar +150 kcal</button>`;
  else if(r>G.hi)rec=`<p><span class="pill warn">${rs}</span> ${G.hi>0?'Rápido demais: vai ser sobretudo gordura. Tira 150 kcal por dia.':G.lo<-0.1?'Ainda não está a descer o suficiente. Tira 150 kcal por dia.':'O peso está a subir. Tira 150 kcal por dia.'}</p><button class="btn sm" data-act="adj" data-v="-150">Aplicar −150 kcal</button>`;
  else rec=`<p><span class="pill ok">${rs}</span> Ritmo certo. Mantém.</p>`}
 const wk=cycleWeek();
 return `<div class="stack"><div><p class="eyebrow">Perfil e progresso</p><h1>Eu</h1></div>
 <div class="card stack"><h3>Peso corporal</h3>
  <div class="row"><label class="fld"><input id="w-in" inputmode="decimal" autocomplete="off" placeholder="${fmt(S.weights.length?S.weights[S.weights.length-1].kg:p.w)}" aria-label="Peso de hoje"><span>kg</span></label><button class="btn sm" data-act="weigh">Registar hoje</button></div>
  ${chart()}${rec}</div>
 <div class="card stack"><h3>Os meus dados</h3>${profForm(p)}
  <div class="kv num"><span>Metabolismo basal</span><span>${t.bmr} kcal</span><span>Gasto diário estimado</span><span>${t.tdee} kcal</span><span>Alvo: ${G.n.toLowerCase()}</span><span>${t.kcal} kcal</span>${S.adj?`<span>Ajuste aplicado</span><span>${S.adj>0?'+':''}${S.adj} kcal</span>`:''}</div>
  ${S.adj?'<button class="btn ghost sm" data-act="adj0">Repor ajuste a 0</button>':''}
  <p class="muted" style="font-size:.9rem">Mudar o peso aqui também o regista no gráfico de hoje.</p></div>
 ${vWatchEu()}
 <div class="card stack"><h3>Ciclo de treino</h3><p>Estás na <b>semana ${wk} de 5</b>. Começou a ${dshort(S.start)}.</p>
  <button class="btn ghost sm" data-act="cycle">Recomeçar ciclo hoje</button></div></div>`;
}

/* ---------- RENDER & EVENTOS ---------- */
function render(){
 $('#app').innerHTML=!S.setup?vSetup():ui.tab==='hoje'?vHoje():ui.tab==='historico'?vHist():ui.tab==='plano'?vPlano():ui.tab==='refeicoes'?vRef():vEu();
 document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===ui.tab));
}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.id);toast.id=setTimeout(()=>t.hidden=true,2200)}

document.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.ex){const d=draft(ui.code);if(!d.t0)d.t0=Date.now();const a=d.v[el.dataset.ex]=d.v[el.dataset.ex]||[];const k=+el.dataset.k;a[k]=a[k]||{};
  const v=el.dataset.f==='r'?parseInt(el.value,10):num(el.value);a[k][el.dataset.f]=isFinite(v)&&v!==null?v:null;save();return}
 if(el.id==='p-age'||el.id==='p-h'||el.id==='p-w'){let v=num(el.value);if(v===null)return;
  if(el.id==='p-h'&&v<3)v=Math.round(v*100);
  if(el.id==='p-age'&&v>=12&&v<=100)S.profile.age=Math.round(v);
  else if(el.id==='p-h'&&v>=120&&v<=230)S.profile.h=Math.round(v);
  else if(el.id==='p-w'&&v>=30&&v<=250){S.profile.w=v;if(S.setup){S.weights=S.weights.filter(x=>x.d!==TODAY);S.weights.push({d:TODAY,kg:v});S.weights.sort((a,b)=>a.d<b.d?-1:1)}}
  else return;save();if(S.setup)refreshKV()}
});
document.addEventListener('change',e=>{const id=e.target.id,v=e.target.value;
 if(id==='p-act')S.profile.act=parseFloat(v);else if(id==='p-sex')S.profile.sex=v;else if(id==='p-goal')S.profile.goal=v;else return;
 save();if(S.setup)render()});
function refreshKV(){clearTimeout(refreshKV.id);refreshKV.id=setTimeout(()=>{const f=document.activeElement&&document.activeElement.id;render();if(f){const el=document.getElementById(f);if(el){el.focus();const l=el.value.length;try{el.setSelectionRange(l,l)}catch(e){}}}},700)}

document.addEventListener('click',e=>{
 const tb=e.target.closest('nav.tabs button');if(tb){ui.tab=tb.dataset.tab;render();window.scrollTo(0,0);return}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='code'){ui.code=b.dataset.c;ui.editing=false;render();toast(`Hoje: treino ${ui.code} · próximo: ${nextCode()}`)}
 else if(a==='history'){ui.tab='historico';render();window.scrollTo(0,0)}
 else if(a==='edit-saved'){const h=savedToday(b.dataset.code);if(!h)return;S.drafts[h.code]={date:TODAY,t0:h.t0,v:Object.fromEntries(h.ex.map(ex=>[ex.id,ex.sets.map(s=>({...s,done:true}))]))};ui.editing=true;save();render()}
 else if(a==='done'){
  const code=ui.code;const d=draft(code),id=b.dataset.ex,k=+b.dataset.k;if(!d.t0)d.t0=Date.now();const arr=d.v[id]=d.v[id]||[];const v=arr[k]=arr[k]||{};
  if(v.done){v.done=false;save();render();return}
  const kgIn=document.getElementById(`kg-${id}-${k}`),rIn=document.getElementById(`r-${id}-${k}`);
  if(v.kg==null&&kgIn.placeholder!=='—')v.kg=num(kgIn.placeholder);
  if(v.r==null||isNaN(v.r)){toast('Escreve as repetições que fizeste');rIn.focus();return}
  v.done=true;save();render();startTimer(+b.dataset.rest);
 }
 else if(a==='save'){if(saveWorkout(b.dataset.code)&&NATIVE&&S.hc.on)setTimeout(()=>syncWatch(TODAY,true),1500)}
 else if(a==='setup'){const p=S.profile,age=num($('#p-age').value),w=num($('#p-w').value);let h=num($('#p-h').value);if(h&&h<3)h=Math.round(h*100);
  if(!age||age<12||age>100){toast('Escreve a tua idade');$('#p-age').focus();return}
  if(!h||h<120||h>230){toast('Escreve a altura em cm, por exemplo 164');$('#p-h').focus();return}
  if(!w||w<30||w>250){toast('Escreve o peso em kg, por exemplo 65');$('#p-w').focus();return}
  if(!$('#p-goal').value){toast('Escolhe o teu objetivo');$('#p-goal').focus();return}
  Object.assign(p,{age:Math.round(age),h:Math.round(h),w,sex:$('#p-sex').value,goal:$('#p-goal').value,act:parseFloat($('#p-act').value)});
  S.weights=[{d:TODAY,kg:w}];S.start=TODAY;S.setup=true;save();ui.tab='hoje';render();window.scrollTo(0,0);toast('Tudo pronto. Bom treino!')}
 else if(a==='hdel'){const dd=b.dataset.d,cc=b.dataset.c;if(b.dataset.watch){const id=decodeURIComponent(b.dataset.watch);if(!confirm(`Apagar o registo do relógio de ${dshort(dd)}?`))return;S.history=S.history.filter(h=>!(h.source==='watch'&&h.watch.id===id));save();render();toast('Registo apagado');return}if(!confirm(`Apagar o treino ${cc} de ${dshort(dd)}?`))return;
  S.history=S.history.filter(h=>!(h.d===dd&&h.code===cc));S.sessions=S.sessions.filter(x=>!(x.d===dd&&x.code===cc));
  allVar(cc).forEach(e=>{if(S.logs[e.id])S.logs[e.id]=S.logs[e.id].filter(l=>l.d!==dd)});save();render();toast('Treino apagado')}
 else if(a==='weigh'){const v=num($('#w-in').value);if(!v||v<30||v>250){toast('Escreve o peso em kg, por exemplo 86,4');return}
  S.weights=S.weights.filter(x=>x.d!==TODAY);S.weights.push({d:TODAY,kg:v});S.weights.sort((x,y)=>x.d<y.d?-1:1);S.profile.w=v;save();render();toast('Peso registado')}
 else if(a==='adj'){S.adj+=+b.dataset.v;save();render();toast(`Novo alvo: ${targets().kcal} kcal`)}
 else if(a==='hc'){hcConnect()}
 else if(a==='watch'){syncWatch(TODAY,false)}
 else if(a==='adj0'){S.adj=0;save();render()}
 else if(a==='cycle'){S.start=TODAY;save();render();toast('Ciclo recomeçado: semana 1')}
 else if(a==='t-plus'){T.end+=15000;T.total+=15;if(!T.id)resume()}
 else if(a==='t-minus'){T.end-=15000;tick()}
 else if(a==='t-stop'){clearInterval(T.id);T.id=null;$('#timer').hidden=true}
});

/* ---------- TEMPORIZADOR ---------- */
const T={end:0,total:90,id:null};let AC=null;
function ensureAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function beep(){if(!AC)return;try{[0,.35,.7].forEach(o=>{const os=AC.createOscillator(),g=AC.createGain();os.frequency.value=880;os.connect(g);g.connect(AC.destination);
 const t=AC.currentTime+o;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);os.start(t);os.stop(t+.3)})}catch(e){}}
function resume(){$('#timer').classList.remove('over');$('#t-label').textContent='Descanso';clearInterval(T.id);T.id=setInterval(tick,250);tick()}
function startTimer(sec){ensureAudio();T.total=sec;T.end=Date.now()+sec*1000;$('#timer').hidden=false;resume()}
function tick(){const left=Math.max(0,Math.ceil((T.end-Date.now())/1000));$('#t-time').textContent=`${Math.floor(left/60)}:${pad(left%60)}`;
 $('#t-bar').style.transform=`scaleX(${T.total?left/T.total:0})`;
 if(left<=0&&T.id){clearInterval(T.id);T.id=null;$('#timer').classList.add('over');$('#t-label').textContent='Próxima série!';beep()}}

document.title=APPNAME;$('#appname').textContent=APPNAME;
if(FLAV==='mary'){const bi=$('#brand-img');bi.src='icons/mary-avatar.png';bi.hidden=false;document.querySelector('.brand small').textContent='Treino e alimentação à tua medida'}
render();
function autoWatch(){if(NATIVE&&S.hc.on)syncWatch(TODAY,true)}
autoWatch();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')autoWatch()});
</script>

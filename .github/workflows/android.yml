name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependências
        run: npm ci

      - name: Copiar a app web para o Android
        run: npm run build && npx cap sync android

      - name: Chave de assinatura
        env:
          KS_B64: ${{ secrets.CATPOWER_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.CATPOWER_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/catpower.jks"
            {
              echo "CATPOWER_KEYSTORE=$RUNNER_TEMP/catpower.jks"
              echo "CATPOWER_KEYSTORE_PASSWORD=$KS_PW"
              echo "CATPOWER_KEY_PASSWORD=$KS_PW"
              echo "CATPOWER_KEY_ALIAS=catpower"
              echo "SIGNED=release"
            } >> "$GITHUB_ENV"
          else
            echo "SIGNED=debug" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        working-directory: android
        env:
          CATPOWER_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          echo "ANDROID_HOME=$ANDROID_HOME"
          TASK=assembleDebug; [ "$SIGNED" = "release" ] && TASK=assembleRelease
          set +e
          ./gradlew $TASK --no-daemon --stacktrace > "$RUNNER_TEMP/gradle.log" 2>&1
          RC=$?
          set -e
          tail -n 60 "$RUNNER_TEMP/gradle.log"
          if [ $RC -ne 0 ]; then
            MSG=$( { grep -A6 -E "^\* Where|What went wrong" "$RUNNER_TEMP/gradle.log" | head -n 16; grep -E "^e: |error:" "$RUNNER_TEMP/gradle.log" | head -n 8; } | grep -v "^\s*$" | sed ':a;N;$!ba;s/\n/ | /g' )
            echo "::error::$MSG"
            exit $RC
          fi
          if [ "$SIGNED" = "release" ]; then
            cp app/build/outputs/apk/release/app-release.apk ../CatPower.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk ../CatPower.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CatPower
          path: CatPower.apk

      - name: Publicar versão
        if: env.SIGNED == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" CatPower.apk \
            --title "Cat Power 1.0.${{ github.run_number }}" \
            --notes "Versão Android da Cat Power, com ligação ao Samsung Health." --latest
